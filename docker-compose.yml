# 018-deployment: a aplicação inteira com um comando (`docker compose up --build`).
# Next.js serve frontend e API no mesmo processo; o SQLite é um arquivo no volume `dados`.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "file:/app/data/app.db"
      UPLOAD_DIR: "/app/data/uploads"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - dados:/app/data
    restart: unless-stopped

  # 025-migracao-legado: carga do legado. Só existe com o perfil `migracao` (não sobe com `docker compose up`):
  #   docker compose --profile migracao run --rm migrar --origem /import/contratos.sql --origem /import/global.sql --anexos /import/anexos --simular
  migrar:
    build:
      context: .
      target: migrar
    profiles: ["migracao"]
    env_file: .env
    environment:
      DATABASE_URL: "file:/app/data/app.db"
      UPLOAD_DIR: "/app/data/uploads"
    volumes:
      - dados:/app/data
      - ./import:/import:ro

volumes:
  dados:
